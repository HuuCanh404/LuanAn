<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#212529">
    Hệ Thống Dự Đoán CPU (System Forecast Architecture)
  </text>

  <!-- ===== ROW 1: Data Collection ===== -->
  <!-- Box: System Metrics -->
  <rect x="30" y="80" width="180" height="80" rx="8" fill="#cfe2ff" stroke="#0d6efd" stroke-width="1.5"/>
  <text x="120" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#084298">Thu thập Hệ thống</text>
  <text x="120" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#084298">CPU%, RAM%</text>
  <text x="120" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#084298">Disk I/O, Network</text>

  <!-- Box: User Behavior -->
  <rect x="240" y="80" width="180" height="80" rx="8" fill="#d1e7dd" stroke="#198754" stroke-width="1.5"/>
  <text x="330" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0a3622">Hành Vi Người Dùng</text>
  <text x="330" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0a3622">Keyboard/Mouse rate</text>
  <text x="330" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0a3622">Active window, Apps</text>

  <!-- Box: Logger -->
  <rect x="450" y="80" width="180" height="80" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="540" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#664d03">Logger (unified_logger)</text>
  <text x="540" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#664d03">psutil + evdev</text>
  <text x="540" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#664d03">1 sample/giây</text>

  <!-- Box: CSV Storage -->
  <rect x="660" y="80" width="200" height="80" rx="8" fill="#e2e3e5" stroke="#6c757d" stroke-width="1.5"/>
  <text x="760" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#343a40">CSV Storage</text>
  <text x="760" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#343a40">unified_log.csv</text>
  <text x="760" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#343a40">cpu_ram_disk_net.csv</text>

  <!-- Arrows row 1 -->
  <line x1="210" y1="120" x2="238" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="120" x2="448" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="120" x2="658" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== ROW 2: Preprocessing ===== -->
  <rect x="200" y="230" width="240" height="80" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="320" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#842029">Tiền Xử Lý Dữ Liệu</text>
  <text x="320" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#842029">MinMaxScaler / StandardScaler</text>
  <text x="320" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#842029">Window Size=10-20 bước</text>

  <!-- Arrow: CSV → Preprocessing -->
  <line x1="760" y1="160" x2="760" y2="215" stroke="#555" stroke-width="1.5"/>
  <line x1="760" y1="215" x2="442" y2="215" stroke="#555" stroke-width="1.5"/>
  <line x1="442" y1="215" x2="442" y2="228" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="230" width="240" height="80" rx="8" fill="#e0cffc" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="580" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3d0066">Feature Engineering</text>
  <text x="580" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3d0066">Moving avg, Lag, Diff</text>
  <text x="580" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3d0066">Rolling std, Net/Disk total</text>

  <!-- Arrow Preprocessing → Feature Engineering -->
  <line x1="440" y1="270" x2="458" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== ROW 3: Models ===== -->
  <!-- Regression Model -->
  <rect x="60" y="390" width="200" height="90" rx="8" fill="#cfe2ff" stroke="#0d6efd" stroke-width="1.5"/>
  <text x="160" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#084298">LinearRegression</text>
  <text x="160" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#084298">(Baseline)</text>
  <text x="160" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#084298">R² ≈ 0.20, MAE ≈ 2.5%</text>
  <text x="160" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#084298">WINDOW=10, t+5s</text>

  <!-- GradientBoosting Model -->
  <rect x="280" y="390" width="200" height="90" rx="8" fill="#d1e7dd" stroke="#198754" stroke-width="1.5"/>
  <text x="380" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0a3622">GradientBoosting</text>
  <text x="380" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0a3622">Regressor (Best)</text>
  <text x="380" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0a3622">Dự đoán CPU% tại t+5s</text>
  <text x="380" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0a3622">WINDOW=15, 6 features</text>

  <!-- RandomForest Classifier -->
  <rect x="500" y="390" width="200" height="90" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="600" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#664d03">RandomForest</text>
  <text x="600" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#664d03">Classifier (Trend)</text>
  <text x="600" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#664d03">Tăng / Ổn định / Giảm</text>
  <text x="600" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#664d03">Accuracy: ~66%</text>

  <!-- MLPRegressor -->
  <rect x="720" y="390" width="150" height="90" rx="8" fill="#e0cffc" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="795" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3d0066">MLPRegressor</text>
  <text x="795" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3d0066">(Neural Network)</text>
  <text x="795" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3d0066">WINDOW=20</text>
  <text x="795" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3d0066">feature engineering</text>

  <!-- Arrows from Feature Engineering to Models -->
  <line x1="500" y1="310" x2="500" y2="360" stroke="#555" stroke-width="1.5"/>
  <line x1="160" y1="360" x2="795" y2="360" stroke="#555" stroke-width="1.5"/>
  <line x1="160" y1="360" x2="160" y2="388" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="360" x2="380" y2="388" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="360" x2="600" y2="388" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="795" y1="360" x2="795" y2="388" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Label rows -->
  <text x="10" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6c757d">Tầng 1: Thu thập dữ liệu</text>
  <text x="10" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6c757d">Tầng 2: Xử lý &amp; Feature Engineering</text>
  <text x="10" y="385" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6c757d">Tầng 3: Mô hình dự đoán (train/test 80/20)</text>

  <!-- Section dividers -->
  <line x1="10" y1="200" x2="890" y2="200" stroke="#dee2e6" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="10" y1="370" x2="890" y2="370" stroke="#dee2e6" stroke-width="1" stroke-dasharray="5,5"/>
</svg>
